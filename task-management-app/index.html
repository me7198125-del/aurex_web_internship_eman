<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Management App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Task Manager</h1>
            <p>Manage your daily tasks easily</p>
        </header>

        <!-- Task Form -->
        <form id="taskForm">

            <div class="input-area">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter your task..."
                    maxlength="100"
                >

                <button type="submit" id="addBtn">
                    Add Task
                </button>
            </div>

            <p id="errorMessage"></p>

        </form>

        <!-- Filter Buttons -->
        <div class="filters" >

            <button class="filter-btn active" data-filter="all">
                All
            </button>

            <button class="filter-btn" data-filter="active">
                Active
            </button>

            <button class="filter-btn" data-filter="completed">
                Completed
            </button>

        </div>

        <!-- Task Statistics -->
        <div class="stats">
            <span>Total: <strong id="totalTasks">0</strong></span>
            <span>Active: <strong id="activeTasks">0</strong></span>
            <span>Completed: <strong id="completedTasks">0</strong></span>
        </div>

        <!-- Task List -->
        <ul id="taskList"></ul>

        <!-- Empty Message -->
        <p id="emptyMessage">
            No tasks found.
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
